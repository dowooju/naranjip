name: Test, publish and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naranjip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: bash ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test placement previews
        run: node --test scripts/placement.test.mjs scripts/auth-validation.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Enable only after registering a trusted, local Windows runner with kubectl access.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_LOCAL_CD == 'true'
    needs: publish
    runs-on: [self-hosted, Windows, X64, naranjip-local]
    environment: local-demo
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the tested commit to Rancher Desktop
        shell: powershell
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: ./scripts/deploy.ps1 -Image $env:DEPLOY_IMAGE
