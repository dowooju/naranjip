name: Test, publish and compose smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naranjip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: bash ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test placement previews
        run: node --test scripts/placement.test.mjs scripts/auth-validation.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    # "Docker만 있는 깨끗한 컴퓨터에서 README대로 실행된다"를 매번 확인한다. .env 없이 기본값으로 실행.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up -d --build
        run: docker compose up -d --build
      - name: Wait until the app is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"UP"'; then echo "ready after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "app did not become ready"; exit 1
      - name: Home page and sample houses
        run: |
          curl -fsS http://localhost:8080/ | grep -q '나란집'
          curl -fsS http://localhost:8080/api/assets/furniture-atlas.png -o /dev/null
          curl -fsS http://localhost:8080/api/rankings | tee rankings.json
          jq -e '(.houses | length) == 4 and .houses[0].house.residents == "햇살방"' rankings.json
          curl -fsS 'http://localhost:8080/api/rankings?type=theme' | jq -e '.theme.title == "비 오는 날의 집"'
      - name: Data survives a restart without duplicate samples
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"UP"' && break
            sleep 5
          done
          curl -fsS http://localhost:8080/api/rankings | jq -e '(.houses | length) == 4'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
