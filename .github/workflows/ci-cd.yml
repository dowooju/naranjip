name: Test and compose smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naranjip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: |
          set -o pipefail
          bash ./mvnw -B verify 2>&1 | tee mvn.log
      - name: Summarize build errors
        # 로그는 로그인해야 보이지만 annotation은 실행 요약에 바로 보인다.
        if: failure()
        run: |
          errors=$(grep -E '^\[ERROR\]' mvn.log | grep -vE 'Re-run Maven|full stack trace|Help 1|^\[ERROR\] *$|-> \[Help' | head -60 | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=Maven errors::${errors:0:12000}"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE 'FAILURE|ERROR' "$f" && echo "::error title=$(basename "$f")::$(head -c 4000 "$f" | tr '\n' '|' | sed 's/%/%25/g')"
          done
          true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test placement previews
        run: node --test scripts/placement.test.mjs scripts/auth-validation.test.mjs

  compose-smoke:
    # "Docker만 있는 깨끗한 컴퓨터에서 README대로 실행된다"를 매번 확인한다. .env 없이 기본값으로 실행.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up -d --build
        run: docker compose up -d --build
      - name: Wait until both app containers are ready
        run: bash scripts/wait-ready.sh http://localhost:8080
      - name: Home page and sample houses
        run: |
          trap 'echo "::error title=Smoke check failed::$BASH_COMMAND"' ERR
          curl -fsS http://localhost:8080/ > home.html && grep '나란집' home.html > /dev/null
          curl -fsS http://localhost:8080/furniture-atlas.png -o /dev/null
          curl -fsS http://localhost:8080/api/rankings | tee rankings.json
          jq -e '(.houses | length) == 4 and .houses[0].house.residents == "햇살방"' rankings.json
          curl -fsS 'http://localhost:8080/api/rankings?type=theme' | jq -e '.theme.title == "비 오는 날의 집"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two app containers share sessions and live editing through Redis
        run: node scripts/multi-instance-smoke.mjs http://localhost:8080
      - name: Data survives a restart without duplicate samples
        run: |
          trap 'echo "::error title=Restart check failed::$BASH_COMMAND"' ERR
          docker compose down
          docker compose up -d
          bash scripts/wait-ready.sh http://localhost:8080
          curl -fsS http://localhost:8080/api/rankings > rankings.json
          # 앞 단계의 스모크 테스트 계정 집도 순위에 있으므로 샘플 집 4채만 센다(중복 생성되면 4보다 많아짐).
          jq -e '[.houses[].house.residents | select(IN("햇살방","구름집","달빛집","솔바람집"))] | length == 4' rankings.json
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs > compose.log 2>&1 || true
          cat compose.log
          # 로그인 없이 볼 수 있도록 중요한 줄을 annotation으로 남긴다.
          [ -f rankings.json ] && echo "::error title=rankings.json::$(head -c 3000 rankings.json)"
          echo "::error title=Container status::$(docker compose ps -a --format '{{.Name}} {{.Status}}' | tr '\n' '|')"
          echo "::error title=Warnings and errors in logs::$(grep -E 'WARN|ERROR|Exception|Caused by|emerg|FAIL' compose.log | head -60 | cut -c1-300 | tr '\n' '|' | sed 's/%/%25/g' | head -c 12000)"
          true
      - name: Clean up
        if: always()
        run: docker compose down -v
