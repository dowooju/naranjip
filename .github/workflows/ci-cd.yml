name: Test, publish and compose smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naranjip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: |
          set -o pipefail
          bash ./mvnw -B verify 2>&1 | tee mvn.log
      - name: Summarize build errors
        # 로그는 로그인해야 보이지만 annotation은 실행 요약에 바로 보인다.
        if: failure()
        run: |
          errors=$(grep -E '^\[ERROR\]' mvn.log | grep -vE 'Re-run Maven|full stack trace|Help 1|^\[ERROR\] *$|-> \[Help' | head -60 | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=Maven errors::${errors:0:12000}"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE 'FAILURE|ERROR' "$f" && echo "::error title=$(basename "$f")::$(head -c 4000 "$f" | tr '\n' '|' | sed 's/%/%25/g')"
          done
          true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test placement previews
        run: node --test scripts/placement.test.mjs scripts/auth-validation.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    # "Docker만 있는 깨끗한 컴퓨터에서 README대로 실행된다"를 매번 확인한다. .env 없이 기본값으로 실행.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up -d --build
        run: docker compose up -d --build
      - name: Wait until both app containers are ready
        run: |
          # nginx가 붙인 X-Upstream 헤더로, 서로 다른 앱 컨테이너 2개가 모두 readiness UP을 응답할 때까지 기다린다.
          for i in $(seq 1 60); do
            ready=$(for j in 1 2 3 4 5 6; do
              curl -fsS -D - -o /dev/null http://localhost:8080/actuator/health/readiness 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-upstream" && $2 !~ /,/ {print $2}'
            done | sort -u | wc -l)
            if [ "$ready" -ge 2 ]; then echo "both ready after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "app containers did not become ready"; docker compose ps; exit 1
      - name: Home page and sample houses
        run: |
          curl -fsS http://localhost:8080/ | grep -q '나란집'
          curl -fsS http://localhost:8080/api/assets/furniture-atlas.png -o /dev/null
          curl -fsS http://localhost:8080/api/rankings | tee rankings.json
          jq -e '(.houses | length) == 4 and .houses[0].house.residents == "햇살방"' rankings.json
          curl -fsS 'http://localhost:8080/api/rankings?type=theme' | jq -e '.theme.title == "비 오는 날의 집"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two app containers share sessions and live editing through Redis
        run: node scripts/multi-instance-smoke.mjs http://localhost:8080
      - name: Data survives a restart without duplicate samples
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"UP"' && break
            sleep 5
          done
          curl -fsS http://localhost:8080/api/rankings | jq -e '(.houses | length) == 4'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
