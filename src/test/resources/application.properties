spring.datasource.url=jdbc:h2:mem:naranjip-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.email-encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.email-lookup-key=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
app.asset-root=./assets
app.asset-storage=local
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.sample-data=false
# 테스트는 Redis 없이 같은 규칙의 메모리 저장소와 앱 내장 세션을 쓴다.
app.live-store=memory
