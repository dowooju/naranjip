spring.application.name=naranjip
server.port=${PORT:8080}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
# Explicit opt-in: demo credentials are NEVER persisted or verified.
app.demo-auth=${DEMO_AUTH_ENABLED:false}
app.asset-root=${ASSET_ROOT:./assets}
app.asset-storage=${ASSET_STORAGE:local}
