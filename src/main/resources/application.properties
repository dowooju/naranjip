spring.application.name=naranjip
server.port=8080
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naranjip}
spring.datasource.username=${DB_USERNAME:naranjip}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
app.email-encryption-key=${EMAIL_ENCRYPTION_KEY}
app.email-lookup-key=${EMAIL_LOOKUP_KEY}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
management.endpoint.health.group.readiness.include=readinessState,db,redis
app.sample-data=${SAMPLE_DATA:true}
app.sample-password=${SAMPLE_PASSWORD:}
# 앱 컨테이너 여러 개가 로그인 세션과 실시간 편집 상태를 Redis로 공유한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.session.redis.namespace=naranjip:session
app.live-store=redis
