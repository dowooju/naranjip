# 나란집 앞단 nginx: 브라우저 요청을 앱 컨테이너 여러 개에 번갈아(라운드 로빈) 보낸다.
# 로그인 세션과 실시간 편집 상태는 Redis에 있으므로 어느 앱이 받아도 같은 결과가 나온다.

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 내부 DNS. 앱 컨테이너가 다시 만들어져도 새 주소를 찾는다.

upstream naranjip {
    zone naranjip 64k;
    server app:8080 resolve;   # app 서비스의 모든 컨테이너(replicas)
}

# WebSocket(/ws/edit) 연결 업그레이드
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        proxy_pass http://naranjip;
        proxy_http_version 1.1;
        # 접속 주소(호스트:포트)를 그대로 넘겨야 WebSocket 동일 출처 검사가 통과한다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;   # 브라우저가 4초마다 ping을 보내므로 충분하다.
        # 어느 앱 컨테이너가 응답했는지 확인용(개발자 도구 Network 탭에서 보임)
        add_header X-Upstream $upstream_addr always;
    }
}
